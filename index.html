<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>美股總經關鍵數據 (自動抓取版)</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --primary: #38bdf8;
      --accent: #f59e0b;
      --border: #334155;
      --bullish: #10b981;
      --bearish: #ef4444;
      --pending: #64748b;
    }
    body.light-theme {
      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-sub: #64748b;
      --border: #e2e8f0;
      --pending: #94a3b8;
    }
    body {
      background: var(--bg-color);
      color: var(--text-main);
      padding: 20px;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
    }
    .container { width: 100%; max-width: 680px; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .theme-btn { padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border); background: var(--card-bg); color: var(--text-main); cursor: pointer; }
    .update-time { font-size: 0.75rem; color: var(--text-sub); }
    .data-item {
      display: flex;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 10px;
    }
    .icon-box { min-width: 90px; text-align: center; border-right: 1px solid var(--border); padding-right: 12px; }
    .badge-name { font-size: 0.75rem; color: var(--text-sub); font-weight: bold; }
    .badge-icon { font-size: 1.8rem; margin: 2px 0; }
    .badge-date { font-size: 0.75rem; color: var(--accent); }
    .info-box { padding-left: 14px; flex: 1; }
    .title-row { display: flex; justify-content: space-between; align-items: center; }
    .title { font-weight: bold; font-size: 0.95rem; }
    .status-badge { font-size: 0.75rem; padding: 2px 8px; border-radius: 4px; color: #fff; }
    .status-bullish { background: var(--bullish); }
    .status-bearish { background: var(--bearish); }
    .status-pending { background: var(--pending); }
    .val-text { font-size: 0.85rem; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="top-bar">
      <span class="update-time" id="updateTime">連線中...</span>
      <button class="theme-btn" onclick="toggleTheme()" id="themeBtn">切換黑白</button>
    </div>

    <div id="dataList"></div>
  </div>

  <script>
    function toggleTheme() {
      document.body.classList.toggle('light-theme');
    }

    // 讀取 Python 自動產生的真實數據檔
    fetch('./data.json?t=' + new Date().getTime())
      .then(res => res.json())
      .then(data => {
        document.getElementById('updateTime').innerText = '最後更新：' + data.last_updated;
        const container = document.getElementById('dataList');
        container.innerHTML = '';

        data.events.forEach(item => {
          let statusClass = 'status-pending';
          if (item.status.includes('優')) statusClass = 'status-bullish';
          if (item.status.includes('悲')) statusClass = 'status-bearish';

          const card = document.createElement('div');
          card.className = 'data-item';
          card.innerHTML = `
            <div class="icon-box">
              <div class="badge-name">${item.name}</div>
              <div class="badge-icon">${item.icon}</div>
              <div class="badge-date">${item.date}</div>
            </div>
            <div class="info-box">
              <div class="title-row">
                <span class="title">${item.title}</span>
                <span class="status-badge ${statusClass}">${item.status}</span>
              </div>
              <div class="val-text">數值：${item.value}</div>
            </div>
          `;
          container.appendChild(card);
        });
      })
      .catch(err => {
        document.getElementById('updateTime').innerText = '資料載入失敗，請確認 data.json 是否生成。';
      });
  </script>
</body>
</html>
