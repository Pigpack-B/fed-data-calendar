name: Hourly Macro Data Crawler

on:
  schedule:
    # 每小時的 0 分自動執行一次 (UTC 0分 = 每個整點)
    - cron: '0 * * * *'
  workflow_dispatch: # 依然保留手動按鈕

permissions:
  contents: write

jobs:
  crawl-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run Crawler
        run: |
          python crawler.py

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Hourly auto update macro data" && git push)
